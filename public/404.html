<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 · randomx bonanza</title>
<meta name="theme-color" content="#ffcfde">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
  @font-face {
    font-family: 'IBM Plex Mono';
    font-style: normal;
    font-weight: 400;
    font-display: swap;
    src: url('fonts/ibm-plex-mono-regular.woff2') format('woff2');
  }
  * { margin: 0; padding: 0; box-sizing: border-box; border-radius: 0; }
  ::selection      { background: rgba(255, 109, 166, 0.32); color: inherit; }
  ::-moz-selection { background: rgba(255, 109, 166, 0.32); color: inherit; }

  body {
    font-family: 'IBM Plex Mono', 'SF Mono', Menlo, 'Cascadia Mono', 'Roboto Mono', monospace;
    color: #1a1815;
    min-height: 100vh;
    background: linear-gradient(to bottom, #ffcfde 0%, #ffffff 65%) fixed;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
  }

  .terminal {
    background-color: #f4f4f2;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='1.4' numOctaves='1' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.18'/></svg>");
    background-size: 220px 220px;
    background-repeat: repeat;
    background-blend-mode: multiply;
    border: 1px solid #6e6b62;
    padding: 2.5rem 3.5rem;
    text-align: center;
    color: #1a1815;
    line-height: 1.45;
    min-width: min(420px, 92vw);
  }

  .terminal .banner {
    font-size: 0.72rem;
    color: #4a4640;
    white-space: pre;
    margin-bottom: 1.4rem;
  }
  .terminal .code {
    font-size: 4.2rem;
    font-weight: 400;
    letter-spacing: 0.12em;
    color: #1a1815;
    line-height: 1;
  }
  .terminal .meta {
    font-size: 0.72rem;
    color: #4a4640;
    margin-top: 1rem;
    letter-spacing: 0.04em;
  }
  .terminal a {
    color: #1a1815;
    text-decoration: underline;
    text-decoration-color: #ff3b8a;
    text-underline-offset: 2px;
    transition: color 0.12s;
  }
  .terminal a:hover  { color: #ff3b8a; }
  .terminal a:active { color: #b81f6a; }
</style>
</head>
<body>
  <main class="terminal">
    <div class="banner">ฅ(⌯͒•̩̩̩́ ˑ̫ •̩̩̩̀⌯͒)ฅ  page not found</div>
    <div class="code">404</div>
    <div class="meta">↩ <a href="/">return to randomx bonanza</a></div>
  </main>
</body>
</html>
